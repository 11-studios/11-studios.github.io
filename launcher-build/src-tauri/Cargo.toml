[package]
name = "eleven-launcher"
version = "2.0.0"
description = "11_Launcher - Rust + Tauri Minecraft Launcher"
authors = ["sems11_"]
edition = "2021"

[lib]
name = "eleven_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
regex = "1"
sha1 = "0.10"
md5 = "0.7"
zip = "0.6"
chrono = "0.4"
urlencoding = "2"
html-escape = "0.2"
walkdir = "2"
num_cpus = "1"
dirs = "5"
