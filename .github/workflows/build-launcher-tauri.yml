name: Build 11 Launcher Tauri EXE

on:
  push:
    branches: [ launcher-tauri-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: launcher-tauri-build

      - name: Reconstruct Rust sources
        run: |
          New-Item -ItemType Directory -Force launcher-build/src-tauri/src | Out-Null
          $enc = New-Object System.Text.UTF8Encoding($false)

          $parts = Get-ChildItem launcher-build/parts/launcher/part*.txt | Sort-Object Name
          $text = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [System.IO.File]::WriteAllText("launcher-build/src-tauri/src/launcher.rs", $text, $enc)

          $parts = Get-ChildItem launcher-build/parts/modded/part*.txt | Sort-Object Name
          $text = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [System.IO.File]::WriteAllText("launcher-build/src-tauri/src/modded.rs", $text, $enc)

      - name: Restore launcher images
        run: |
          New-Item -ItemType Directory -Force launcher-build/frontend/assets | Out-Null
          Invoke-WebRequest "https://raw.githubusercontent.com/11-studios/11-studios.github.io/main/assets/site-icon.png" -OutFile "launcher-build/frontend/assets/11_title_icon.png"
          Invoke-WebRequest "https://raw.githubusercontent.com/11-studios/11-studios.github.io/main/assets/logo-v7.png" -OutFile "launcher-build/frontend/assets/11_studio_logo.png"
          Invoke-WebRequest "https://raw.githubusercontent.com/11-studios/11-studios.github.io/main/assets/hero-wordmark.png" -OutFile "launcher-build/frontend/assets/11_play_logo.png"
          Copy-Item "launcher-build/frontend/assets/11_play_logo.png" "launcher-build/frontend/assets/11_wordmark.png"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release EXE
        working-directory: launcher-build/src-tauri
        run: cargo build --release

      - name: Stage EXE
        run: |
          Copy-Item "launcher-build/src-tauri/target/release/eleven-launcher.exe" "11_Launcher_v2.0_Rust_Tauri.exe"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: 11_Launcher_v2.0_Rust_Tauri_EXE
          path: 11_Launcher_v2.0_Rust_Tauri.exe
          if-no-files-found: error
