name: Embed Ataturk hero
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/embed-ataturk.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Embed image in homepage
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'src="assets/ataturk-hero.webp"'
          data = '''data:image/webp;base64,'''
          if old not in s:
              raise SystemExit('target not found')
          s = s.replace(old, f'src="{data}"', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Embed Ataturk hero image"
          git push
