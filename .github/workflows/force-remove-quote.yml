name: Force remove Ataturk quote cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-remove-quote.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bust cached assets and hard-hide stale quote
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('href="assets/style.css"','href="assets/style.css?v=20261015-12"')
          s=s.replace('src="assets/app.js?v=20261014-2"','src="assets/app.js?v=20261015-12"')
          hard='<style id="remove-ataturk-quote">.ataturk-quote{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important}</style>'
          if 'id="remove-ataturk-quote"' not in s:
              s=s.replace('</head>',hard+'\n</head>')
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/force-remove-quote.yml
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/force-remove-quote.yml
          git commit -m "Force-remove stale Ataturk quote and bust cache"
          git push
