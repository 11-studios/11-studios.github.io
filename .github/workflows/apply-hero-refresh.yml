name: Apply hero refresh
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-hero-refresh.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images and patch hero
        shell: python
        run: |
          from pathlib import Path
          import base64

          hero64 = ''.join(Path(f'.hero_upload/part{i}.txt').read_text(encoding='utf-8').strip() for i in range(1, 7))
          Path('assets/ataturk-hero-hq.webp').write_bytes(base64.b64decode(hero64))
          logo64 = Path('.hero_upload/wordmark.txt').read_text(encoding='utf-8').strip()
          Path('assets/hero-wordmark.png').write_bytes(base64.b64decode(logo64))

          css = Path('assets/style.css')
          s = css.read_text(encoding='utf-8')
          s = s.replace('background:url("ataturk-hero-v2.webp")', 'background:url("ataturk-hero-hq.webp")', 1)
          s += '''

/* HERO WORDMARK - replaces developer badge */
.eyebrow{
  display:block!important;
  width:210px!important;
  height:46px!important;
  padding:0!important;
  border:0!important;
  border-radius:0!important;
  background:url("hero-wordmark.png") left center/contain no-repeat!important;
  font-size:0!important;
  color:transparent!important;
  gap:0!important;
}
.eyebrow img{display:none!important}
@media(max-width:620px){.eyebrow{width:185px!important;height:41px!important}}
'''
          css.write_text(s, encoding='utf-8')
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ataturk-hero-hq.webp assets/hero-wordmark.png assets/style.css
          git commit -m "Improve hero portrait and add wordmark"
          git push
