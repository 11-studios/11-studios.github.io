name: Fix homepage title

on:
  push:
    paths:
      - '.github/workflows/fix-title.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace homepage title
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          wanted = 'Bi kaç plugin var istersen kullan.'

          index = Path('index.html')
          s = index.read_text()
          old_h1 = '<h1 id="heroTitle">Pluginlerini <span class="accent">paylaş.</span><br>Sunucunu büyüt.</h1>'
          if old_h1 not in s and wanted not in s:
              raise SystemExit('Expected homepage title not found in index.html')
          s = s.replace(old_h1, f'<h1 id="heroTitle">{wanted}</h1>')
          s = s.replace('src="assets/app.js"', 'src="assets/app.js?v=20261014-2"')
          index.write_text(s)

          original = Path('assets/app-original.js')
          js = original.read_text()
          old_js = 'heroTitle:\'Pluginlerini <span class="accent">paylaş.</span><br>Sunucunu büyüt.\''
          new_js = "heroTitle:'Bi kaç plugin var istersen kullan.'"
          if old_js not in js and new_js not in js:
              raise SystemExit('Expected Turkish heroTitle not found in app-original.js')
          js = js.replace(old_js, new_js)
          original.write_text(js)

          shutil.copyfile(original, 'assets/app.js')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/app.js assets/app-original.js
          git diff --cached --quiet && exit 0
          git commit -m "Change homepage title"
          git push
