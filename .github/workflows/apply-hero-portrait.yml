name: Apply hero portrait

on:
  push:
    paths:
      - '.github/workflows/apply-hero-portrait.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace hero logo with portrait
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html, n = re.subn(
              r'<img class="brand-orbit" src="[^"]+" alt="11_ Studios logo">',
              '<img class="brand-orbit hero-portrait" src="assets/ataturk-hero.webp" alt="Atatürk">',
              html,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'hero image replacement count: {n}')
          index.write_text(html, encoding='utf-8')

          css_path = Path('assets/style.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* HERO PORTRAIT OVERRIDE */'
          if marker in css:
              css = css.split(marker)[0].rstrip() + '\n'
          css += '''\n/* HERO PORTRAIT OVERRIDE */\n.hero-visual{height:520px!important}\n.orbit-wrap{width:540px!important;height:520px!important}\n.brand-orbit.hero-portrait{width:min(520px,100%)!important;max-height:520px!important;height:auto!important;object-fit:contain!important;image-rendering:auto!important;filter:none!important;animation:none!important;transform:none!important;position:relative!important;z-index:2!important}\n@media(max-width:860px){.hero-visual{height:430px!important}.orbit-wrap{width:100%!important;height:430px!important}.brand-orbit.hero-portrait{width:min(410px,92vw)!important;max-height:430px!important}}\n'''
          css_path.write_text(css, encoding='utf-8')
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/style.css
          git diff --cached --quiet && exit 0
          git commit -m "Replace hero logo with Ataturk portrait"
          git push
