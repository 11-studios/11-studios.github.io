name: Fix hero asset

on:
  push:
    paths:
      - '.github/workflows/fix-hero.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore full CSS and hero image
        run: |
          curl -L --fail 'https://raw.githubusercontent.com/11-studios/11-studios.github.io/40568cbbc1e01c49cf94960861ce6f6478714035/assets/style.css' -o assets/style.css
          cat >> assets/style.css <<'EOF'

/* HERO PORTRAIT OVERRIDE */
.hero-visual{height:520px!important}
.orbit-wrap{width:540px!important;height:520px!important;transform:none!important}
.brand-orbit.hero-portrait{width:min(520px,100%)!important;max-height:520px!important;height:auto!important;object-fit:contain!important;image-rendering:auto!important;filter:none!important;animation:none!important;transform:none!important;position:relative!important;z-index:2!important}
@media(max-width:860px){.hero-visual{height:430px!important}.orbit-wrap{width:100%!important;height:430px!important;transform:none!important}.brand-orbit.hero-portrait{width:min(410px,92vw)!important;max-height:430px!important}}
@media(max-width:620px){.hero-visual{height:300px!important}.orbit-wrap{width:100%!important;height:300px!important;transform:none!important}.brand-orbit.hero-portrait{width:min(300px,88vw)!important;max-height:300px!important}}
EOF
          git show 7bf1bcdc3f9ed098cce1621d6d61ad6f46459f04:assets/ataturk-hero.webp > assets/ataturk-hero.webp
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/style.css assets/ataturk-hero.webp
          git commit -m 'Fix Ataturk hero image and restore CSS' || exit 0
          git push
