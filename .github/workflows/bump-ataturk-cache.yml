name: Publish site v38
on:
  push:
    paths:
      - '.github/workflows/bump-ataturk-cache.yml'
      - 'assets/plugin-browser-v37.js'
      - 'assets/plugin-browser-v37.css'
      - 'assets/editor-runtime-v37.js'
      - 'assets/editor-runtime-v37.css'
      - 'assets/editor-v37.js'
      - 'assets/editor-v37.css'
      - 'editor.html'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install v38 frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          V='20261016-38'
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('<div class="kicker" id="storeKicker">Mağaza</div><h2 id="storeTitle">Son pluginler</h2>','<div class="kicker" id="storeKicker">11_ Studios</div><h2 id="storeTitle">Pluginler</h2>')
          s=s.replace('Yaptığımız Minecraft pluginleri. Ücretsiz olanları indir, premium olanlara göz at.','Minecraft sunucuları için yayınladığımız pluginler.')
          s=s.replace('<div class="market-title"><h3>11_ Market</h3>','<div class="market-title"><h3>Pluginler</h3>')
          s=s.replace('Yönetim verileri bu tarayıcıda saklanır. GitHub Pages sunucu tarafı veritabanı sağlamadığından, ortak ve kalıcı yönetim için backend entegrasyonu gerekir.','Pluginler, hesaplar ve site düzenleri buluta kaydedilir. Kaydettiğin değişiklikler tüm cihazlarda görünür.')

          for name in ('plugin-browser-v37.css','editor-runtime-v37.css'):
              pattern=rf'<link rel="stylesheet" href="assets/{re.escape(name)}\?v=[^"]+">'
              repl=f'<link rel="stylesheet" href="assets/{name}?v={V}">'
              if re.search(pattern,s): s=re.sub(pattern,repl,s,count=1)
              else: s=s.replace('</head>',repl+'\n</head>',1)

          for name in ('plugin-browser-v37.js','editor-runtime-v37.js'):
              pattern=rf'<script src="assets/{re.escape(name)}\?v=[^"]+" defer></script>'
              repl=f'<script src="assets/{name}?v={V}" defer></script>'
              if re.search(pattern,s): s=re.sub(pattern,repl,s,count=1)
              else: s=s.replace('</body>',repl+'\n</body>',1)

          p.write_text(s,encoding='utf-8')

          e=Path('editor.html')
          x=e.read_text(encoding='utf-8')
          x=re.sub(r'assets/editor-v37\.css\?v=[^"\']+',f'assets/editor-v37.css?v={V}',x)
          x=re.sub(r'assets/editor-v37\.js\?v=[^"\']+',f'assets/editor-v37.js?v={V}',x)
          x=re.sub(r'editorPreview=1&v=[^"\']+',f'editorPreview=1&v=38',x)
          e.write_text(x,encoding='utf-8')
          PY
      - name: Verify v38
        run: |
          test -s editor.html
          test -s assets/plugin-browser-v37.js
          test -s assets/plugin-browser-v37.css
          test -s assets/editor-runtime-v37.js
          test -s assets/editor-runtime-v37.css
          test -s assets/editor-v37.js
          test -s assets/editor-v37.css
          node --check assets/plugin-browser-v37.js
          node --check assets/editor-runtime-v37.js
          node --check assets/editor-v37.js
          grep -q 'const PAGE_SIZE=10' assets/plugin-browser-v37.js
          grep -q 'editor-api' assets/editor-runtime-v37.js
          grep -q 'editor-api' assets/editor-v37.js
          grep -q 'pointermove' assets/editor-runtime-v37.js
          grep -q 'propOpacity' assets/editor-v37.js
          grep -q 'propX' assets/editor-v37.js
          grep -q 'plugin-browser-v37.js?v=20261016-38' index.html
          grep -q 'editor-runtime-v37.js?v=20261016-38' index.html
          grep -q 'editor-v37.js?v=20261016-38' editor.html
          grep -q 'editorPreview=1&v=38' editor.html
      - name: Commit v38
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html editor.html
          git diff --cached --quiet && exit 0
          git commit -m 'Publish site v38 editor fixes and 10 item pages'
          git push