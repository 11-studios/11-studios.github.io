name: Publish site v20
on:
  push:
    paths:
      - '.github/workflows/bump-ataturk-cache.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch site to v20 assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'assets/app\.js\?v=[^"\']+', 'assets/app.js?v=20261015-20', s)
          s=re.sub(
              r'<img\s+class="brand-orbit hero-portrait"[^>]*>',
              '<img class="brand-orbit hero-portrait" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Atatürk">',
              s,
              count=1,
          )
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cache-bust
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Publish site v20 cache bust'
          git push
