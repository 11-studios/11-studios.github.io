name: Publish site v44
on:
  push:
    paths:
      - '.github/workflows/bump-ataturk-cache.yml'
      - 'assets/editor-v37.js'
      - 'assets/editor-v37.css'
      - 'assets/editor-runtime-v37.js'
      - 'assets/editor-runtime-v37.css'
      - 'assets/editor-v40-bridge.js'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pin v44 editor assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          V='20261016-44'

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'assets/editor-runtime-v37\.css\?v=[^"\']+', f'assets/editor-runtime-v37.css?v={V}', s)
          s=re.sub(r'assets/editor-runtime-v37\.js\?v=[^"\']+', f'assets/editor-runtime-v37.js?v={V}', s)
          p.write_text(s,encoding='utf-8')

          e=Path('editor.html')
          x=e.read_text(encoding='utf-8')
          x=re.sub(r'assets/editor-v37\.css\?v=[^"\']+', f'assets/editor-v37.css?v={V}', x)
          x=re.sub(r'assets/editor-v37\.js\?v=[^"\']+', f'assets/editor-v37.js?v={V}', x)
          x=re.sub(r'assets/editor-v40-bridge\.js\?v=[^"\']+', f'assets/editor-v40-bridge.js?v={V}', x)
          x=re.sub(r'editorPreview=1&v=[^"\']+', 'editorPreview=1&v=44', x)
          e.write_text(x,encoding='utf-8')
          PY
      - name: Verify v44
        run: |
          node --check assets/editor-v37.js
          node --check assets/editor-runtime-v37.js
          node --check assets/editor-v40-bridge.js
          grep -q 'editor-v37.js?v=20261016-44' editor.html
          grep -q 'editorPreview=1&v=44' editor.html
          grep -q 'editor-runtime-v37.js?v=20261016-44' index.html
      - name: Commit cache refs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html editor.html
          git diff --cached --quiet && exit 0
          git commit -m 'Publish site v44 editor visibility fixes'
          git push