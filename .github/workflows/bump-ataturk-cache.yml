name: Publish site v25
on:
  push:
    paths:
      - '.github/workflows/bump-ataturk-cache.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Embed Ataturk image directly into index
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re
          raw = Path('assets/ataturk-final.jpg').read_bytes()
          assert raw[:2] == b'\xff\xd8' and raw[-2:] == b'\xff\xd9', 'invalid JPEG'
          uri = 'data:image/jpeg;base64,' + base64.b64encode(raw).decode('ascii')
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<img class="brand-orbit hero-portrait" src="' + uri + '" alt="Atatürk" style="display:block!important;visibility:visible!important;opacity:1!important;width:520px!important;max-width:100%!important;height:auto!important;object-fit:contain!important;object-position:center bottom!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;filter:none!important;">'
          s = re.sub(r'<img\s+class="brand-orbit hero-portrait"[^>]*>', lambda m: tag, s, count=1)
          s = re.sub(r'assets/app\.js\?v=[^"\']+', 'assets/app.js?v=20261016-25', s)
          s = re.sub(r'assets/style\.css\?v=[^"\']+', 'assets/style.css?v=20261016-25', s)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit v25
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Publish site v25 embedded Ataturk portrait'
          git push