name: Publish site v35
on:
  push:
    paths:
      - '.github/workflows/bump-ataturk-cache.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install transparent Ataturk portrait
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, re

          V='20261016-35'
          names='abcdefg'
          parts=[Path(f'assets/ataturk-v35-{x}.b64').read_text(encoding='utf-8').strip() for x in names]
          raw=base64.b64decode(''.join(parts), validate=True)
          assert raw.startswith(b'\x89PNG\r\n\x1a\n'), 'invalid PNG'
          assert hashlib.sha256(raw).hexdigest() == 'dd9490378349b11424cbadb915d040e15519863cf386dfbfc0fd9a2484308752', 'portrait checksum mismatch'
          Path('assets/ataturk-cutout.png').write_bytes(raw)

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<img class="brand-orbit hero-portrait"[^>]*>', f'<img class="brand-orbit hero-portrait" src="assets/ataturk-cutout.png?v={V}" alt="Atatürk" width="512" height="422" decoding="async" fetchpriority="high">', s, count=1)
          preload=f'<link rel="preload" as="image" href="assets/ataturk-cutout.png?v={V}" type="image/png" fetchpriority="high">'
          s=re.sub(r'<link rel="preload" as="image" href="assets/ataturk-[^"]+\?v=[^"]+"(?: type="image/[^"]+")? fetchpriority="high">', preload, s, count=1)
          s=re.sub(r'<link rel="stylesheet" href="assets/site\.css\?v=[^"]+">', f'<link rel="stylesheet" href="assets/site.css?v={V}">', s, count=1)
          p.write_text(s, encoding='utf-8')

          css=Path('assets/site.css')
          c=css.read_text(encoding='utf-8')
          c += '\n/* v35 transparent portrait */\n#top .hero-visual .orbit-wrap .brand-orbit.hero-portrait{display:block!important;visibility:visible!important;opacity:1!important;width:520px!important;max-width:100%!important;height:auto!important;object-fit:contain!important;object-position:center bottom!important;image-rendering:auto!important;background:transparent!important;box-shadow:none!important;filter:none!important;-webkit-mask-image:none!important;mask-image:none!important;border-radius:0!important}\n#top .hero-visual .orbit-wrap{background:none!important;background-image:none!important;overflow:visible!important}\n'
          css.write_text(c, encoding='utf-8')
          PY
      - name: Verify portrait
        run: |
          test -s assets/ataturk-cutout.png
          python - <<'PY'
          from pathlib import Path
          import hashlib
          raw=Path('assets/ataturk-cutout.png').read_bytes()
          assert len(raw) == 40588
          assert hashlib.sha256(raw).hexdigest() == 'dd9490378349b11424cbadb915d040e15519863cf386dfbfc0fd9a2484308752'
          PY
          grep -q 'assets/ataturk-cutout.png?v=20261016-35' index.html
          grep -q 'assets/site.css?v=20261016-35' index.html
      - name: Commit v35
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/site.css assets/ataturk-cutout.png
          git diff --cached --quiet && exit 0
          git commit -m 'Publish site v35 transparent Ataturk PNG'
          git push