name: Publish site v23
on:
  push:
    paths:
      - '.github/workflows/bump-ataturk-cache.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exact Ataturk image and switch site to v23
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re, hashlib
          parts = [
              Path('assets/ataturk-final.b64').read_text(encoding='utf-8').strip(),
              Path('assets/ataturk-final-2.b64').read_text(encoding='utf-8').strip(),
              Path('assets/ataturk-final-3.b64').read_text(encoding='utf-8').strip(),
          ]
          b64 = ''.join(parts)
          raw = base64.b64decode(b64, validate=True)
          assert raw[:2] == b'\xff\xd8' and raw[-2:] == b'\xff\xd9', 'invalid JPEG'
          assert hashlib.sha256(raw).hexdigest() == '53eb825d0ed779b95fb371d3ba39675c2657c4f927a52da0cf6e21ccb629a3d1', 'image checksum mismatch'
          Path('assets/ataturk-final.jpg').write_bytes(raw)
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'assets/app\.js\?v=[^"\']+', 'assets/app.js?v=20261016-23', s)
          s=re.sub(r'<img\s+class="brand-orbit hero-portrait"[^>]*>', '<img class="brand-orbit hero-portrait" src="assets/ataturk-final.jpg?v=20261016-23" alt="Atatürk">', s, count=1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit v23
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/ataturk-final.jpg
          git diff --cached --quiet && exit 0
          git commit -m 'Publish site v23 exact Ataturk portrait'
          git push
