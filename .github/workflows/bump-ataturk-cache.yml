name: Publish site v30
on:
  push:
    paths:
      - '.github/workflows/bump-ataturk-cache.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build optimized secure site v30
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          V='20261016-30'

          base=Path('assets/style-base.css').read_text(encoding='utf-8')
          style=Path('assets/style.css').read_text(encoding='utf-8')
          style=re.sub(r'^\s*@import\s+url\(["\']style-base\.css["\']\);\s*','',style,count=1,flags=re.M)
          css_parts=[
            base,
            style,
            Path('assets/simple.css').read_text(encoding='utf-8'),
            Path('assets/site-enhancements.css').read_text(encoding='utf-8'),
            Path('assets/plugin-files.css').read_text(encoding='utf-8'),
            Path('assets/store-search.css').read_text(encoding='utf-8'),
          ]
          site_css='\n'.join(css_parts)
          site_css=re.sub(r'/\*.*?\*/','',site_css,flags=re.S)
          site_css=re.sub(r'\n{3,}','\n\n',site_css)
          Path('assets/site.css').write_text(site_css,encoding='utf-8')

          media=Path('assets/app-media.js').read_text(encoding='utf-8')
          media=media.replace("const heroPromise=loadParts('assets/final-wordmark',8);", "const heroPromise=Promise.resolve('static');")
          media=media.replace("const faviconPromise=loadParts('assets/final-favicon',4);", "const faviconPromise=Promise.resolve('static');")
          media=media.replace("img.src=`data:image/png;base64,${heroData}`;", f"img.src='assets/hero-wordmark.png?v={V}';img.decoding='async';")
          media=media.replace("favicon.type='image/png';favicon.href=`data:image/png;base64,${data}`;", f"favicon.type='image/png';favicon.href='assets/site-icon.png?v={V}';")

          start=media.find("  const app=document.createElement('script');")
          load=media.find("  app.addEventListener('load',()=>{\n",start)
          end_marker="\n  });\n  document.head.appendChild(app);\n})();"
          end=media.rfind(end_marker)
          if min(start,load,end) < 0:
            raise SystemExit('app-media optimization markers missing')
          body_start=load+len("  app.addEventListener('load',()=>{\n")
          media_core=media[:start]+media[body_start:end]+"\n})();\n"

          js_files=[
            Path('assets/app-original.js').read_text(encoding='utf-8'),
            Path('assets/supabase-sync.js').read_text(encoding='utf-8'),
            Path('assets/cloud-accounts.js').read_text(encoding='utf-8'),
            media_core,
            Path('assets/site-enhancements.js').read_text(encoding='utf-8'),
            Path('assets/plugin-files.js').read_text(encoding='utf-8'),
            Path('assets/cloud-files.js').read_text(encoding='utf-8'),
            Path('assets/store-search.js').read_text(encoding='utf-8'),
          ]
          Path('assets/site-app.js').write_text('\n;\n'.join(js_files),encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<link rel="stylesheet" href="assets/style\.css\?v=[^"]+">',f'<link rel="stylesheet" href="assets/site.css?v={V}">',s,count=1)
          s=re.sub(r'<link rel="icon"[^>]*>',f'<link rel="icon" href="assets/site-icon.png?v={V}" type="image/png">',s,count=1)
          s=re.sub(r'<img class="logo"[^>]*>',f'<img class="logo" src="assets/hero-wordmark.png?v={V}" alt="11_ Studios" decoding="async">',s,count=1)
          s=re.sub(r'<img class="brand-orbit hero-portrait"[^>]*>',f'<img class="brand-orbit hero-portrait" src="assets/ataturk-final.jpg?v={V}" alt="Atatürk" width="512" height="512" decoding="async" fetchpriority="high">',s,count=1)

          hints=f'<link rel="preconnect" href="https://mzrnuiunfxaendnrigzk.supabase.co" crossorigin>\n<link rel="preload" as="image" href="assets/ataturk-final.jpg?v={V}" fetchpriority="high">'
          if 'rel="preconnect" href="https://mzrnuiunfxaendnrigzk.supabase.co"' not in s:
            s=s.replace('</title>','</title>\n'+hints,1)

          s=re.sub(r'<script src="assets/app\.js\?v=[^"]+"></script>',f'<script src="assets/site-app.js?v={V}" defer></script>',s,count=1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify optimized output
        run: |
          test -s assets/site.css
          test -s assets/site-app.js
          grep -q 'assets/site.css?v=20261016-30' index.html
          grep -q 'assets/site-app.js?v=20261016-30' index.html
          grep -q 'class="brand-orbit hero-portrait" src="assets/ataturk-final.jpg?v=20261016-30"' index.html
          grep -q 'class="logo" src="assets/hero-wordmark.png?v=20261016-30"' index.html
      - name: Commit v30
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/site.css assets/site-app.js
          git diff --cached --quiet && exit 0
          git commit -m 'Publish site v30 optimized secure bundle'
          git push