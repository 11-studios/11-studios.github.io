name: Publish catalog v54
on:
  push:
    paths:
      - '.github/workflows/bump-ataturk-cache.yml'
      - 'assets/app-original.js'
      - 'assets/cloud-accounts.js'
      - 'assets/app-media.js'
      - 'assets/site-enhancements.js'
      - 'assets/plugin-files.js'
      - 'assets/supabase-sync.js'
      - 'assets/cloud-files.js'
      - 'assets/catalog-v54.js'
      - 'assets/catalog-v54.css'
      - 'assets/editor-runtime-v37.js'
      - 'assets/editor-runtime-v37.css'
      - 'assets/editor-state-preload-v47.js'
      - 'assets/editor-live-sync-v38.js'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build clean v54 core and pin catalog assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          V='20261019-54'

          media=Path('assets/app-media.js').read_text(encoding='utf-8')
          media=media.replace("const heroPromise=loadParts('assets/final-wordmark',8);", "const heroPromise=Promise.resolve('static');")
          media=media.replace("const faviconPromise=loadParts('assets/final-favicon',4);", "const faviconPromise=Promise.resolve('static');")
          media=media.replace("img.src=`data:image/png;base64,${heroData}`;", f"img.src='assets/hero-wordmark.png?v={V}';img.decoding='async';")
          media=media.replace("favicon.type='image/png';favicon.href=`data:image/png;base64,${data}`;", f"favicon.type='image/png';favicon.href='assets/site-icon.png?v={V}';")
          start=media.find("  const app=document.createElement('script');")
          load=media.find("  app.addEventListener('load',()=>{\n",start)
          end_marker="\n  });\n  document.head.appendChild(app);\n})();"
          end=media.rfind(end_marker)
          if min(start,load,end) < 0:
              raise SystemExit('app-media optimization markers missing')
          body_start=load+len("  app.addEventListener('load',()=>{\n")
          media_core=media[:start]+media[body_start:end]+"\n})();\n"

          js_files=[
            Path('assets/app-original.js').read_text(encoding='utf-8'),
            Path('assets/cloud-accounts.js').read_text(encoding='utf-8'),
            media_core,
            Path('assets/site-enhancements.js').read_text(encoding='utf-8'),
            Path('assets/plugin-files.js').read_text(encoding='utf-8')
          ]
          Path('assets/site-app.js').write_text('\n;\n'.join(js_files),encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'assets/editor-state-preload-v47\.js\?v=[^"\']+', f'assets/editor-state-preload-v47.js?v={V}', s)
          s=re.sub(r'assets/(?:plugin-browser-v37|catalog-v54)\.css\?v=[^"\']+', f'assets/catalog-v54.css?v={V}', s)
          s=re.sub(r'assets/editor-runtime-v37\.css\?v=[^"\']+', f'assets/editor-runtime-v37.css?v={V}', s)

          block=re.compile(
            r'<script src="assets/supabase-sync\.js\?v=[^"]+" defer></script>\s*'
            r'<script src="assets/site-app\.js\?v=[^"]+" defer></script>\s*'
            r'<script src="assets/cloud-files\.js\?v=[^"]+" defer></script>\s*'
            r'<script src="assets/(?:plugin-browser-v37|catalog-v54)\.js\?v=[^"]+" defer></script>\s*'
            r'<script src="assets/editor-runtime-v37\.js\?v=[^"]+" defer></script>(?:\s*<script src="assets/editor-live-sync-v38\.js\?v=[^"]+" defer></script>)?'
          )
          new=(
            f'<script src="assets/supabase-sync.js?v={V}" defer></script>\n'
            f'<script src="assets/site-app.js?v={V}" defer></script>\n'
            f'<script src="assets/cloud-files.js?v={V}" defer></script>\n'
            f'<script src="assets/catalog-v54.js?v={V}" defer></script>\n'
            f'<script src="assets/editor-runtime-v37.js?v={V}" defer></script>\n'
            f'<script src="assets/editor-live-sync-v38.js?v={V}" defer></script>'
          )
          s,n=block.subn(new,s,count=1)
          if n!=1:
              raise SystemExit('script block not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify v54
        run: |
          node --check assets/site-app.js
          node --check assets/supabase-sync.js
          node --check assets/cloud-files.js
          node --check assets/catalog-v54.js
          node --check assets/editor-runtime-v37.js
          node --check assets/editor-live-sync-v38.js
          grep -q 'Premium Pluginler' assets/catalog-v54.js
          grep -q 'PAGE_SIZE=5' assets/catalog-v54.js
          grep -q 'assets/supabase-sync.js?v=20261019-54' index.html
          grep -q 'assets/catalog-v54.js?v=20261019-54' index.html
          grep -q 'assets/catalog-v54.css?v=20261019-54' index.html
          grep -q 'assets/editor-live-sync-v38.js?v=20261019-54' index.html
      - name: Commit v54
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/site-app.js
          git diff --cached --quiet && exit 0
          git commit -m 'Publish v54 premium plugin catalog'
          git push
