name: Publish site v28
on:
  push:
    paths:
      - '.github/workflows/bump-ataturk-cache.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep Ataturk visible and publish accounts v28
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          base = Path('assets/style-base.css')
          s = base.read_text(encoding='utf-8')
          s = s.replace('background:url("ataturk-hero-v2.webp") center bottom/contain no-repeat!important;', 'background:none!important;background-image:none!important;')
          s = s.replace('.brand-orbit.hero-portrait{display:none!important}', '.brand-orbit.hero-portrait{display:block!important;visibility:visible!important;opacity:1!important}')
          base.write_text(s, encoding='utf-8')

          css = Path('assets/style.css')
          s = css.read_text(encoding='utf-8')
          marker = '/* HERO VISIBILITY FIX V26 */'
          if marker not in s:
              s += '\n' + marker + '\n#top .hero-visual .orbit-wrap .brand-orbit.hero-portrait{display:block!important;visibility:visible!important;opacity:1!important;position:relative!important;z-index:5!important;width:520px!important;max-width:100%!important;height:auto!important;object-fit:contain!important;object-position:center bottom!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;animation:none!important;filter:none!important}\n#top .hero-visual .orbit-wrap{background:none!important;background-image:none!important;overflow:visible!important}\n'
          css.write_text(s, encoding='utf-8')

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          s = re.sub(r'assets/style\.css\?v=[^"\']+', 'assets/style.css?v=20261016-28', s)
          s = re.sub(r'assets/app\.js\?v=[^"\']+', 'assets/app.js?v=20261016-28', s)
          index.write_text(s, encoding='utf-8')

          app = Path('assets/app.js')
          a = app.read_text(encoding='utf-8')
          a = re.sub(r"const VERSION='[^']+'", "const VERSION='20261016-28'", a, count=1)
          app.write_text(a, encoding='utf-8')
          PY
      - name: Commit v28
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/style-base.css assets/style.css assets/app.js
          git diff --cached --quiet && exit 0
          git commit -m 'Publish site v28 cloud accounts and analytics'
          git push