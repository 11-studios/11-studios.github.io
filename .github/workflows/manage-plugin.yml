name: Manage plugin

on:
  workflow_dispatch:
    inputs:
      action:
        description: add, update veya delete
        required: true
        type: choice
        options: [add, update, delete]
      id:
        description: Plugin ID (örn. 11-chatheads)
        required: true
        type: string
      name:
        description: Plugin adı (delete için boş olabilir)
        required: false
        type: string
      version:
        description: Sürüm
        required: false
        type: string
      category:
        description: Kategori
        required: false
        type: choice
        options: [utility, security, visual, other]
      price:
        description: Fiyat (0 = ücretsiz)
        required: false
        default: "0"
        type: string
      icon:
        description: Tek emoji ikon
        required: false
        default: "🧩"
        type: string
      desc_tr:
        description: Türkçe açıklama
        required: false
        type: string
      desc_en:
        description: English description
        required: false
        type: string
      url:
        description: HTTPS indirme/satış bağlantısı
        required: false
        type: string

permissions:
  contents: write

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and update catalog
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          ID: ${{ inputs.id }}
          NAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
          CATEGORY: ${{ inputs.category }}
          PRICE: ${{ inputs.price }}
          ICON: ${{ inputs.icon }}
          DESC_TR: ${{ inputs.desc_tr }}
          DESC_EN: ${{ inputs.desc_en }}
          URL: ${{ inputs.url }}
        run: |
          set -euo pipefail
          [[ "$ID" =~ ^[a-z0-9][a-z0-9_-]{1,63}$ ]] || { echo "Invalid ID"; exit 1; }
          if [[ -n "$URL" && "$URL" != https://* ]]; then echo "URL must use HTTPS"; exit 1; fi
          case "$ACTION" in
            delete)
              jq --arg id "$ID" 'map(select(.id != $id))' plugins.json > plugins.tmp.json
              ;;
            add|update)
              [[ -n "$NAME" && -n "$VERSION" ]] || { echo "name/version required"; exit 1; }
              [[ "$PRICE" =~ ^[0-9]+([.][0-9]+)?$ ]] || { echo "Invalid price"; exit 1; }
              jq --arg id "$ID" --arg name "$NAME" --arg version "$VERSION" --arg category "$CATEGORY" --argjson price "$PRICE" --arg icon "$ICON" --arg tr "$DESC_TR" --arg en "$DESC_EN" --arg url "$URL" '(map(select(.id != $id))) + [{id:$id,name:$name,version:$version,category:$category,price:$price,icon:$icon,desc:{tr:$tr,en:$en},url:$url}]' plugins.json > plugins.tmp.json
              ;;
            *) echo "Unknown action"; exit 1;;
          esac
          jq -e 'type=="array" and all(.[]; (.id|type=="string") and (.name|type=="string") and (.url|type=="string") and ((.url=="") or (.url|startswith("https://"))))' plugins.tmp.json >/dev/null
          mv plugins.tmp.json plugins.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins.json
          git diff --cached --quiet && exit 0
          git commit -m "Update plugin catalog: ${{ inputs.id }}"
          git push
